# Fast accrue_admin fixture smoke. Merge-blocking mounted admin browser proofs
# are examples/accrue_host VERIFY-01 Playwright under host-integration (merge-blocking CI path).
name: AccrueAdmin Browser UAT

on:
  pull_request:
    paths:
      - "accrue/**"
      - "accrue_admin/**"
      - ".github/workflows/accrue_admin_browser.yml"
  push:
    branches: [main]
    paths:
      - "accrue/**"
      - "accrue_admin/**"
      - ".github/workflows/accrue_admin_browser.yml"
  workflow_dispatch: {}

# Quick task 261025-vdn (item 2): pull_request runs for the same ref cancel
# each other; every other event (push to main, schedule, workflow_dispatch)
# gets a run_id-unique group and is never cancelled. The run_id half is
# load-bearing: with one shared main group, a newer PENDING run would REPLACE
# an older pending push/schedule/dispatch run even with cancel-in-progress
# false. scripts/ci/verify_ci_efficiency_contract.mjs pins this exact shape.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Quick task 261025-vdn (item 3): compile deps in 4 partitions (ubuntu-24.04
# runners have 4 vCPU). Workflow-wide; the efficiency contract fails on a
# missing value or any job-level override.
env:
  MIX_OS_DEPS_COMPILE_PARTITION_COUNT: 4

jobs:
  browser-uat:
    name: Browser UAT
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      ACCRUE_ADMIN_E2E_PORT: 4017

    steps:
      - uses: actions/checkout@v6

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.0"
          elixir-version: "1.19.5"

      - name: Install Hex
        run: mix local.hex 2.4.2 --force

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: accrue_admin/package-lock.json

      - name: Install Elixir deps
        run: cd accrue_admin && mix deps.get

      - name: Compile admin package
        run: cd accrue_admin && mix compile --warnings-as-errors

      - name: Install browser deps
        run: cd accrue_admin && npm ci

      - name: Install Chromium
        run: cd accrue_admin && npx playwright install --with-deps chromium

      - name: Run browser UAT
        run: cd accrue_admin && npm run e2e

      - name: Test Admin hooks and visual baseline set guard
        run: cd accrue_admin && node --test test/js/*.mjs

      - name: Require complete committed visual baseline set
        run: node accrue_admin/e2e/visual-baseline-set.cjs accrue_admin/e2e/__screenshots__/visual-desktop

      - name: Phase 211 visual regression gate
        run: cd accrue_admin && npm run e2e:visual-regression

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-admin-playwright-report
          path: accrue_admin/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-admin-playwright-traces
          path: accrue_admin/test-results
          if-no-files-found: ignore

  # Non-blocking baseline-mint job. Pixel baselines are OS/font-stack specific and
  # MUST be generated on the Linux CI runner (Mac-minted baselines fail on Linux
  # 100%). Baselines are now committed, so this runs on demand only — dispatch it
  # manually (Actions → AccrueAdmin Browser UAT → Run workflow) whenever an
  # intentional UI change requires re-minting, then download artifact
  # `phase211-visual-baselines` and commit the refreshed PNGs. Guarded to
  # workflow_dispatch so it no longer runs on every accrue_admin PR.
  visual-baselines-mint:
    name: Mint visual baselines
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      ACCRUE_ADMIN_E2E_PORT: 4017

    steps:
      - uses: actions/checkout@v6

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.0"
          elixir-version: "1.19.5"

      - name: Install Hex
        run: mix local.hex 2.4.2 --force

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: accrue_admin/package-lock.json

      - name: Install Elixir deps
        run: cd accrue_admin && mix deps.get

      - name: Compile admin package
        run: cd accrue_admin && mix compile --warnings-as-errors

      - name: Install browser deps
        run: cd accrue_admin && npm ci

      - name: Install Chromium
        run: cd accrue_admin && npx playwright install --with-deps chromium

      - name: Mint visual baselines
        run: cd accrue_admin && npm run e2e:visual-regression -- --update-snapshots

      - name: Upload minted baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase211-visual-baselines
          path: accrue_admin/e2e/__screenshots__
          if-no-files-found: ignore

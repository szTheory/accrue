name: CI

# Job id contract — stable YAML `jobs:` keys relied on by docs, `act`, and anchors:
# `release-manifest-ssot`, `release-gate`, `phase18-tax-gate`, `admin-drift-docs`,
# `admin-group-contracts`, `admin-hardening-guardrails`,
# `admin-phase200-guardrails`, `admin-ui-ratchet-selftests`, `admin-ui-ratchet-guardrails`,
# `host-integration`, `playwright-e2e`,
# `host-docker-smoke`, `annotation-sweep`, `provider-proof-trigger`, `live-stripe`,
# `provider-proof-incident`.
# Merge-blocking on pull_request: `release-manifest-ssot`, `docs-contracts-shift-left`,
# `release-gate`, `phase18-tax-gate`, `admin-drift-docs`, `admin-group-contracts`,
# `admin-hardening-guardrails`, `admin-phase200-guardrails`,
# `admin-ui-ratchet-selftests`, `host-integration`, `playwright-e2e`,
# `host-docker-smoke`, `annotation-sweep`.
# Non-blocking (job-level continue-on-error, disposition: parked; see .planning/WINDOWS.md
# row 11): `admin-ui-ratchet-guardrails`. It stays in `annotation-sweep`'s
# `needs:` for ordering/annotation purposes only -- it is not part of the
# merge-blocking required-job set above.
# Mandatory periodic: `live-stripe` (Stripe test-mode parity) runs on
# `workflow_dispatch`, `schedule`, and relevant main-branch repairs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_stripe:
        description: Run the mandatory Stripe test-mode parity proof for this manual dispatch.
        type: boolean
        required: true
        default: true
  schedule:
    # Daily 06:00 UTC — runs the mandatory periodic live-stripe job only,
    # not the default test matrix. See the `live-stripe` job below and
    # `guides/testing-live-stripe.md`.
    - cron: '0 6 * * *'

# SL-F (quick task 260917-l7v) widened this block by exactly one entry:
# verify_pr_body_currency.mjs reads a pull request body to prove the committed
# copy matches the published one. Never `pull-requests: write`, and never
# convert a trigger to `pull_request_target` -- SL-A's
# --require-no-pull-request-target goes red if anyone does, which is the
# intended interlock. verify_provider_proof.mjs asserts this block verbatim,
# so any further widening must be argued there too, not just here.
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  provider-proof-trigger:
    name: Stripe provider-proof trigger classifier
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.classify.outputs.should_run }}
      trigger_class: ${{ steps.classify.outputs.trigger_class }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: classify
        name: Classify scheduled, manual, or relevant repair proof
        run: >-
          node scripts/ci/provider_proof_automation.mjs --classify-trigger
          --event "${{ github.event_name }}"
          --before "${{ github.event.before || '0000000000000000000000000000000000000000' }}"
          --sha "${{ github.sha }}"
          --output "$GITHUB_OUTPUT"

  docs-contracts-shift-left:
    name: Docs and bash contracts (shift-left)
    # Support-contract bundle CI home: verify_processor_support_matrix.sh,
    # verify_package_docs.sh, verify_verify01_readme_contract.sh,
    # and verify_adoption_proof_matrix.sh all run here as merge-blocking checks.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04

    steps:
      # Full history, not the default depth-1: the D-16 step below resolves a
      # pinned candidate SHA that a shallow clone does not contain, and several
      # later contracts walk ancestry rather than reading a recorded JSON.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Node is set up FIRST, ahead of setup-beam and `mix deps.get`, so the
      # cheap hermetic Node-only contract guards below can run in seconds
      # rather than after a ~90s toolchain install. The tokens-harness steps
      # later in this job reuse this same setup -- its npm cache key still
      # resolves, since brandbook/tokens/harness/package-lock.json is present
      # immediately after checkout.
      - name: Set up Node (contract guards + tokens harness)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: brandbook/tokens/harness/package-lock.json

      # Quick task 260917-l7v (SL-E): a requirement marked Complete must carry
      # evidence checkable at branch tip -- a phase VERIFICATION.md with
      # `status: passed` and at least one UAT/SUMMARY artifact citing the
      # requirement ID -- and the checkbox list and the traceability table must
      # agree in BOTH directions. Phase 232 marked REL-04 Complete roughly
      # eight hours before its deliverable existed; this is the state invariant
      # that was violated at that moment and that CI can actually observe.
      # Deliberately carries no allowlist: see the script header.
      - name: Completion-mark evidence (SL-E)
        run: >-
          node --test --test-reporter=tap scripts/ci/verify_completion_evidence.mjs &&
          node scripts/ci/verify_completion_evidence.mjs --fixtures --require-completion-evidence --require-table-agreement &&
          node scripts/ci/verify_completion_evidence.mjs --repo . --require-completion-evidence --require-table-agreement

      # Quick task 260917-l7v (SL-A): the committed integration PR body is now
      # a deterministic PROJECTION of a typed JSON claims sidecar, restoring
      # the convention at scripts/ci/README.md line 29. CI evaluates typed
      # scalars through a frozen evaluator table and never executes any string
      # from a committed file; the byte-exact re-render join plus the mutual
      # claim-id join make the two artifacts un-forgeable relative to each
      # other. An unknown kind, a schema violation, an evaluator error, a
      # timeout, or a measured-versus-asserted mismatch all FAIL -- there is no
      # skip path, because a skip path is how the check this replaces went
      # vacuous.
      #
      # --require-remote-refs (SL-B) is the ref-hygiene half: a `ref`-typed
      # claim field naming a bare local branch fails with an `origin/`-prefixed
      # remediation. Phase 232 asserted a merge count of 3, "corrected" it to
      # 9, and 9 was right only against a 4-commit-stale local `main`; a fresh
      # clone yields 4. It is set on BOTH invocations below -- the --fixtures
      # run is where the rule is non-vacuous today, since the committed sidecar
      # is built entirely from content-addressed claims and declares no ref
      # field (the real run prints that inspected count rather than hiding it).
      - name: PR claims contract (SL-A)
        run: >-
          node --test --test-reporter=tap scripts/ci/render_pr_claims.mjs &&
          node --test --test-reporter=tap scripts/ci/verify_pr_claims.mjs &&
          node scripts/ci/verify_pr_claims.mjs --fixtures --require-claims --require-render-join --require-remote-refs --require-no-pull-request-target &&
          node scripts/ci/verify_pr_claims.mjs --repo .
          --claims "$(node scripts/ci/phase_evidence_path.mjs 232-bounded-hygiene-release-handoff 232-INTEGRATION-PR.json)"
          --body "$(node scripts/ci/phase_evidence_path.mjs 232-bounded-hygiene-release-handoff 232-INTEGRATION-PR.md)"
          --expected-repository szTheory/accrue
          --require-claims --require-render-join --require-remote-refs --require-no-pull-request-target
          --min-executed 1

      # Quick task 260917-l7v (SL-D): under `set -euo pipefail`, a `grep -q`/
      # `-v` consumer exits at its first match, the producer dies of SIGPIPE,
      # and pipefail silently inverts the pipeline's exit status -- exactly
      # the shape hand-fixed twice in one session (`3f6791c7`, `7e9f45dc`)
      # with nothing preventing a third. Bespoke, not shellcheck: shellcheck
      # 0.11.0 reports nothing on this shape and the upstream rule is
      # unreleased (see the script header for the full rationale).
      - name: Pipefail/SIGPIPE grep idiom ban (SL-D)
        run: >-
          node --test --test-reporter=tap scripts/ci/verify_pipefail_grep_idiom.mjs &&
          node scripts/ci/verify_pipefail_grep_idiom.mjs --fixtures --require-idiom-ban &&
          node scripts/ci/verify_pipefail_grep_idiom.mjs --repo . --require-idiom-ban

      # Quick task 260917-l7v (SL-G): 232-UAT.md's started:/updated: used to
      # be derived from 232-VERIFICATION.md's verified: field, while
      # VERIFICATION's covered_digest covers the UAT artifact -- a
      # DERIVES-then-COVERS cycle where every verifier run re-staled the
      # digest it had just satisfied. The cycle is broken at its source
      # (verify_executable_uat_contract.mjs now derives those timestamps from
      # the phase's own SUMMARY completed: dates), and this guard proves it:
      # cycle detection over declared derived_from:/covered_files: edges,
      # byte-level regeneration fixed-point, and covered_digest truth against
      # the actual covered files -- closing the hand-written-digest escape
      # hatch that broke the cycle by hand before this task.
      - name: Artifact fixed-point and derivation-cycle guard (SL-G)
        run: >-
          node --test --test-reporter=tap scripts/ci/verify_artifact_fixed_point.mjs &&
          node scripts/ci/verify_artifact_fixed_point.mjs --fixtures --require-acyclic --require-fixed-point --require-digest-match &&
          node scripts/ci/verify_artifact_fixed_point.mjs --repo . --require-acyclic --require-fixed-point --require-digest-match

      # Quick task 260917-l7v (SL-C): repo-wide census of a sensitive
      # third-party reference, replacing a per-file `grep -c <one file> -> 0`
      # check that under-measured its own subject. Primary invariant is the
      # scope lock (the reference may appear only under `.planning/`, never in
      # anything that would reach a published Hex tarball); the count ratchet
      # is secondary and one-directional. Uses no CI secrets, so it behaves
      # identically on fork pull requests. All output is redacted.
      # Quick task 260917-l7v (SL-F): a committed pull-request body must match
      # the live body it represents. Fails closed on a missing credential --
      # never skips, because skip-when-unavailable is how a gate goes vacuous.
      # Expect a TRUE transient red when a body edit is committed before
      # `gh pr edit <n> --body-file <path>` is run; the gate prints that command.
      - name: Committed PR body matches the live PR body (SL-F)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node --test --test-reporter=tap scripts/ci/verify_pr_body_currency.mjs &&
          node scripts/ci/verify_pr_body_currency.mjs --fixtures --require-currency &&
          node scripts/ci/verify_pr_body_currency.mjs --repo . --expected-repository szTheory/accrue --require-currency --min-declared 1

      - name: Sensitive token census (SL-C)
        run: >-
          node --test --test-reporter=tap scripts/ci/verify_sensitive_token_census.mjs &&
          node scripts/ci/verify_sensitive_token_census.mjs --fixtures --require-scope-lock --require-ratchet --require-no-cleartext &&
          node scripts/ci/verify_sensitive_token_census.mjs --repo . --census .planning/hygiene/sensitive-token-census.json --require-scope-lock --require-ratchet --require-no-cleartext

      - name: Set up BEAM for reference-scenario verification
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.19.5'

      - name: Install Accrue dependencies for reference-scenario verification
        run: cd accrue && mix deps.get

      - name: verify_package_docs.sh
        env:
          RELEASE_PLEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') && '1' || '' }}
        run: bash scripts/ci/verify_package_docs.sh

      - name: Processor support matrix contract
        run: bash scripts/ci/verify_processor_support_matrix.sh

      - name: Core stays LiveView-runtime-free (ENT-07 D-05)
        run: bash scripts/ci/verify_core_liveview_runtime_free.sh

      - name: Entitlement gate path stays advisory-cache-free (ENT-10 D-04)
        run: bash scripts/ci/verify_entitlement_sync_isolation.sh

      - name: Dunning core stays Chimeway-free (DUN-03 D-04)
        run: bash scripts/ci/verify_dunning_chimeway_isolation.sh

      - name: v1.17 friction + north-star SSOT contract
        run: bash scripts/ci/verify_v1_17_friction_research_contract.sh

      - name: VERIFY-01 README contract
        run: bash scripts/ci/verify_verify01_readme_contract.sh

      - name: Docker DX contract
        run: bash scripts/ci/verify_docker_dx_contract.sh

      - name: Production readiness discoverability contract
        run: bash scripts/ci/verify_production_readiness_discoverability.sh

      - name: Adoption proof matrix contract
        run: bash scripts/ci/verify_adoption_proof_matrix.sh

      - name: Reference scenario public-contract gate
        run: V159_SKIP_RELEASE_CONTRACT=true bash scripts/ci/verify_reference_scenario_contract.sh

      - name: Core admin invoice VERIFY flow id drift guard
        run: bash scripts/ci/verify_core_admin_invoice_verify_ids.sh

      - name: Stable-core posture contract
        run: bash scripts/ci/verify_stable_core_posture.sh

      - name: No absolute home paths (PII guard)
        run: >-
          bash scripts/ci/verify_no_home_paths.sh --self-test &&
          bash scripts/ci/verify_no_home_paths.sh --repo

      - name: Roadmap hygiene contract
        run: bash scripts/ci/verify_roadmap_hygiene.sh

      - name: Release notes freshness contract
        run: bash scripts/ci/verify_release_notes_contract.sh

      - name: Executable UAT contract self-test
        run: >-
          node scripts/ci/verify_executable_uat_contract.mjs --self-test &&
          node scripts/ci/verify_executable_uat_contract.mjs --all-opted-in &&
          node scripts/ci/verify_executable_uat_contract.mjs --all-since 229

      # Phase 229 repository-truth and recovery-safety suites. These are hermetic:
      # they build disposable repositories and capsules in a temp dir and touch no
      # network, credential, or maintainer-held private capsule. Strict verification
      # of the *published* capsule is deliberately NOT run here — it is a
      # point-in-time check that fails on any planning-doc update, so it has no
      # recurring CI value (see 229-VERIFICATION.md § Operating Constraint).
      - name: Repository preservation transaction matrix (REPO-02)
        run: bash scripts/ci/preserve_repository_state.sh --self-test

      - name: Repository inventory collect/render/verify units (REPO-01, REPO-02)
        run: >-
          node --test scripts/ci/collect_repository_inventory.mjs &&
          node --test scripts/ci/render_repository_inventory.mjs &&
          node --test scripts/ci/verify_repository_inventory.mjs

      - name: Repository inventory strict fixture contract (REPO-01)
        run: >-
          node scripts/ci/verify_repository_inventory.mjs --fixtures
          --expected-repository szTheory/accrue
          --require-complete-categories --require-edge-cases
          --require-all-ref-recovery --require-typed-artifacts
          --require-privacy-controls --require-determinism
          --require-command-provenance

      - name: Final handoff invariants (REPO-02)
        run: node scripts/ci/verify_phase229_handoff_invariants.mjs --self-test

      - name: Exact-SHA CI monitor and wrapper contract (REPO-03)
        run: >-
          node scripts/ci/ci_monitor.cjs --self-test
          --verify-wrapper scripts/ci/watch_ci.sh
          --verify-docs scripts/ci/README.md

      - name: Repository truth gap-closure regression suite (CR-01..CR-10, WR-01, WR-02)
        run: node --test scripts/ci/phase229_gap_closure.test.mjs

      - name: Phase-evidence archive-path sweep (D-22 standing invariant)
        run: >-
          node --test scripts/ci/verify_phase230_archive_invariants.mjs &&
          node scripts/ci/verify_phase230_archive_invariants.mjs --fixtures &&
          node scripts/ci/verify_phase230_archive_invariants.mjs

      # WR-01: the Phase 230 integration-disposition triad's own regression
      # protection, hermetic only -- these build disposable fixture git repos
      # and touch no ref outside them. Deliberately does NOT depend on
      # integration/v1.62-candidate or review/v1.62-candidate-code-only:
      # those refs are local-only and unpushed, so a step that required them
      # would fail on every GitHub runner.
      - name: Integration disposition triad units and fixture contract (D-04, D-15, D-20, D-21, D-37)
        run: >-
          node --test scripts/ci/collect_integration_disposition.mjs &&
          node --test scripts/ci/render_integration_disposition.mjs &&
          node --test scripts/ci/verify_integration_disposition.mjs &&
          node scripts/ci/verify_integration_disposition.mjs --fixtures --expected-repository szTheory/accrue --require-hazard-universe

      # Phase 231: these three steps are hermetic -- each builds disposable
      # fixture git repositories in a temp directory and touches no network,
      # no credential, and no ref outside them. They deliberately do NOT
      # depend on integration/v1.62-candidate or review/v1.62-candidate-code-only:
      # review/v1.62-candidate-code-only never leaves the machine, and while
      # integration/v1.62-candidate now exists on origin (pushed by Plan 04),
      # a CI step binding to a mutable integration branch would still be
      # wrong -- these are the repository's own regression suites, not a
      # live-candidate proof.
      - name: Shared module-boundary guard contract (D-29)
        run: node --test --test-reporter=tap scripts/ci/main_module.mjs

      - name: Recut candidate shape and ancestry contract (D-01, D-04, D-07)
        run: >-
          node --test scripts/ci/verify_recut_candidate.mjs &&
          node scripts/ci/verify_recut_candidate.mjs --fixtures --expected-repository szTheory/accrue

      - name: GATE-01 cohort triad units and fixture contract (D-09, D-10, D-18)
        run: >-
          node --test scripts/ci/collect_gate01_cohort.mjs &&
          node --test scripts/ci/render_gate01_cohort.mjs &&
          node --test scripts/ci/verify_gate01_cohort.mjs &&
          node scripts/ci/verify_gate01_cohort.mjs --fixtures --expected-repository szTheory/accrue --require-cohort-completeness --require-declaration-drift --require-exit-codes --require-clean-checkout --require-determinism

      - name: Window dispositions triad units and fixture contract (D-22, D-26, D-30, D-31)
        run: >-
          node --test scripts/ci/collect_window_dispositions.mjs &&
          node --test scripts/ci/render_window_dispositions.mjs &&
          node --test scripts/ci/verify_window_dispositions.mjs &&
          node scripts/ci/verify_window_dispositions.mjs --fixtures --expected-repository szTheory/accrue --require-row-join --require-evidence-freshness --require-waiver-completeness --require-determinism

      # Phase 232 (D-16, D-17, plan 232-10): the step above only ever proves the
      # verifier's own logic against synthetic --fixtures data -- --fixtures
      # returns before --records/--rendered are ever read, so the documented
      # "verify the committed window-disposition pair" invocation has never
      # actually run in CI until this step. This one runs the real path: it
      # reads the committed 232-WINDOW-DISPOSITIONS.json/.md pair and asserts,
      # via --candidate, that the record's own candidate_object resolves to
      # the literal 40-hex SHA below -- never the mutable integration branch
      # name (see the comment above the D-29/D-01/D-09 steps: a step bound to
      # a moving ref verifies a different tree on every run).
      - name: Committed window dispositions at the pinned candidate SHA (D-16)
        run: >-
          node scripts/ci/verify_window_dispositions.mjs --repo .
          --records "$(node scripts/ci/phase_evidence_path.mjs 232-bounded-hygiene-release-handoff 232-WINDOW-DISPOSITIONS.json)"
          --rendered "$(node scripts/ci/phase_evidence_path.mjs 232-bounded-hygiene-release-handoff 232-WINDOW-DISPOSITIONS.md)"
          --expected-repository szTheory/accrue
          --candidate c1397fe9127a9b4b2b1d3a0758d57879b14f4604
          --require-row-join --require-evidence-freshness --require-waiver-completeness --require-determinism

      # Phase 232 (HYG-01, D-45..D-54): the pre-cleanup classification triad,
      # hermetic only -- collector/renderer/verifier units and the
      # verifier's own --fixtures negative-control battery. This step does
      # NOT re-run the verifier against the committed 232-HYGIENE-
      # DISPOSITIONS.{json,md} pair (unlike a live-repository check, that
      # would fail on every future PR the instant any new untracked file,
      # worktree, debug branch, or remote branch appears, since
      # classification is a point-in-time record, not a standing invariant)
      # -- it proves the triad's own logic, matching the window-dispositions
      # step immediately above.
      - name: Hygiene dispositions triad units and fixture contract (HYG-01)
        run: >-
          node --test scripts/ci/collect_hygiene_dispositions.mjs &&
          node --test scripts/ci/render_hygiene_dispositions.mjs &&
          node --test scripts/ci/verify_hygiene_dispositions.mjs &&
          node scripts/ci/verify_hygiene_dispositions.mjs --fixtures --expected-repository szTheory/accrue --require-completeness --require-soundness --require-determinism

      # Phase 232 (REL-04): the integration PR body is a committed artifact,
      # so the contract over it is merge-blocking like every other document
      # contract in this job. It checks SHAPE, not currency -- risk-first
      # heading, the provenance-versus-behavior sentence, an inline rollback
      # command, per-claim falsifiability, a density band, and no leaked
      # filesystem path or adopter name. It deliberately does NOT assert the
      # head SHA is current: the candidate is re-cut across plans, and a
      # contract that went red on every re-cut would be re-pointed reflexively
      # rather than read. Currency is the re-cut's own job (see the superseded-
      # target guard in verify_release_pr_readiness.sh).
      #
      # --require-falsifiability is GONE (quick task 260917-l7v, SL-A), not
      # merely unset: it accepted any bullet containing a backtick, which is a
      # punctuation check wearing the name of a truth check, and three false
      # claims shipped through it. Claim truth is now measured by the
      # "PR claims contract (SL-A)" step near the top of this job.
      - name: Integration PR body contract (REL-04)
        run: >-
          node --test scripts/ci/verify_pr_body_contract.mjs &&
          node scripts/ci/verify_pr_body_contract.mjs
          --body "$(node scripts/ci/phase_evidence_path.mjs 232-bounded-hygiene-release-handoff 232-INTEGRATION-PR.md)"
          --expected-repository szTheory/accrue
          --require-sections --require-density

      # Phase 232: the ci_baseline triad existed since Phase 226 but was
      # never wired here, and two of its three files failed `node --test`
      # (D-34). Plan 232-03 fixed the guards and non-vacuity before this
      # wiring step, in the same plan -- the fix-then-wire ordering D-34
      # requires. `--require-required-job-set` is the one strict flag safe
      # to combine with `--fixtures`: it reads the live ci.yml directly and
      # needs no `--records` NDJSON, unlike `--require-critical-path`/
      # `--require-event-class`/`--require-exit-codes`, which do.
      - name: CI baseline triad units and fixture contract (D-34)
        run: >-
          node --test --test-reporter=tap scripts/ci/collect_ci_baseline.mjs &&
          node --test --test-reporter=tap scripts/ci/render_ci_baseline.mjs &&
          node --test --test-reporter=tap scripts/ci/verify_ci_baseline.mjs &&
          node scripts/ci/verify_ci_baseline.mjs --fixtures --require-required-job-set --expected-repository szTheory/accrue

      # Phase 232 (D-32): the meta-verifier that keeps the guard-and-non-
      # vacuity contract self-enforcing -- a future scripts/ci/*.mjs file
      # that omits the shared guard or registers no real test fails here.
      # The --fixtures self-test alone would only prove the verifier's own
      # logic against synthetic inputs; the --repo . invocation below runs
      # it against the real cohort, closing the exact D-16 class of
      # "documented but never executed" verification.
      - name: CI script contract (D-32)
        run: >-
          node --test --test-reporter=tap scripts/ci/verify_ci_script_contract.mjs &&
          node scripts/ci/verify_ci_script_contract.mjs --fixtures --expected-repository szTheory/accrue --require-guard-coverage --require-non-vacuity --require-cohort-floor &&
          node scripts/ci/verify_ci_script_contract.mjs --repo . --expected-repository szTheory/accrue --require-guard-coverage --require-non-vacuity --require-cohort-floor

      - name: Install tokens harness
        run: cd brandbook/tokens/harness && npm ci

      - name: Regenerate tokens + specimens
        run: cd brandbook/tokens/harness && npm run generate && npm run specimens

      - name: Tokens/specimens are reproducible (determinism gate, D-17)
        run: git diff --exit-code -- brandbook/tokens/tokens.css brandbook/examples/palette.svg brandbook/examples/typography.svg brandbook/examples/spacing.svg

      - name: Verify tokens completeness (SC#1)
        run: cd brandbook/tokens/harness && npm run verify

      - name: Verify specimen content coverage (SC#3)
        run: cd brandbook/tokens/harness && npm run verify-specimens

      - name: Brand↔admin token parity (SC#2)
        run: cd brandbook/tokens/harness && npm run parity

      - name: Parity drift detection proof (SC#2 both directions)
        run: cd brandbook/tokens/harness && npm run parity-test

  ios-offline-client:
    name: iOS offline client package compatibility
    if: github.event_name != 'schedule'
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Verify iOS offline client package boundary
        run: bash scripts/ci/verify_ios_offline_client.sh

  release-manifest-ssot:
    name: Release manifest SSOT (REL-02)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up BEAM for reference-scenario verification
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.19.5'

      - name: Install Accrue dependencies for reference-scenario verification
        run: cd accrue && mix deps.get

      - name: Verify Release Please manifest ↔ mix.exs @version
        run: bash scripts/ci/verify_release_manifest_alignment.sh

      - name: Verify linked release contract
        run: bash scripts/ci/verify_release_contract.sh

      # Phase 232 follow-up: release 1.6.0 tagged NOTHING while reporting
      # success because the grouped release-PR title lost its version and
      # failed PullRequestTitle.parse. The script explains the mechanism.
      - name: Verify grouped release-PR title round-trips
        run: bash scripts/ci/verify_release_pr_title_roundtrip.sh

      # Phase 232 (D-39, REL-05): side-effect-free proof that Release Please
      # is ready to produce a version-and-changelog-consistent release PR.
      # Gated on token availability so a fork PR without repo secrets does
      # not produce a misleading red -- but the skip path is visible (this
      # step's own output states it skipped for a missing token) and the
      # script itself still fails closed on a missing token when actually
      # invoked (see the negative control in 232-05-SUMMARY.md).
      - name: Release PR readiness dry run (REL-05)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Release PR readiness dry run (REL-05): SKIPPED -- no GH_TOKEN available (fork PR without repo secrets)."
            exit 0
          fi
          bash scripts/ci/verify_release_pr_readiness.sh

  release-gate:
    name: Release gate (${{ matrix.compatibility }}; elixir=${{ matrix.elixir }} otp=${{ matrix.otp }} sigra=${{ matrix.sigra }} opentelemetry=${{ matrix.opentelemetry }})${{ matrix.support == 'advisory' && ' [advisory]' || '' }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor — minimum supported compatibility cell.
          # Required deterministic gate: high-severity trust findings block release here.
          - elixir: '1.19.0'
            otp: '28.0'
            sigra: 'off'
            opentelemetry: 'off'
            compatibility: 'Floor'
            support: 'required'
          # Primary dev target compatibility cell.
          # Required deterministic gate: high-severity trust findings block release here.
          - elixir: '1.19.5'
            otp: '28.0'
            sigra: 'off'
            opentelemetry: 'off'
            compatibility: 'Primary dev target'
            support: 'required'
          # Advisory compatibility cell: unpublished optional :sigra integration.
          # Advisory cells stay visibly non-blocking through matrix continue-on-error.
          - elixir: '1.19.5'
            otp: '28.0'
            sigra: 'on'
            opentelemetry: 'off'
            compatibility: 'Primary dev target'
            support: 'advisory'
          # Required compatibility cell: optional OpenTelemetry integration is supported and stays blocking.
          - elixir: '1.19.5'
            otp: '28.0'
            sigra: 'off'
            opentelemetry: 'on'
            compatibility: 'Primary dev target'
            support: 'required'

    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      ACCRUE_CI_SIGRA: ${{ matrix.sigra == 'on' && '1' || '' }}
      ACCRUE_CI_OPENTELEMETRY: ${{ matrix.opentelemetry == 'on' && '1' || '' }}
      ACCRUE_OTEL_MATRIX: ${{ matrix.opentelemetry == 'on' && 'with_opentelemetry' || 'without_opentelemetry' }}

    # Required cells remain release-blocking; only clearly labeled advisory cells may use continue-on-error.
    continue-on-error: ${{ matrix.support == 'advisory' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install Hex
        run: mix local.hex 2.4.2 --force

      - name: Restore accrue deps cache
        uses: actions/cache@v5
        with:
          path: accrue/deps
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ matrix.sigra }}-${{ matrix.opentelemetry }}-deps-${{ hashFiles('accrue/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ matrix.sigra }}-${{ matrix.opentelemetry }}-deps-

      - name: Install accrue deps
        run: cd accrue && mix deps.get

      - name: Accrue format
        run: cd accrue && mix format --check-formatted

      - name: Accrue compile
        run: cd accrue && mix compile --warnings-as-errors

      - name: Accrue test
        run: cd accrue && mix test --warnings-as-errors

      - name: Accrue credo
        run: cd accrue && mix credo --strict

      # --- Dialyzer with split restore/save PLT cache (CLAUDE.md recipe) ---
      - name: Restore accrue PLT cache
        id: accrue_plt_cache
        uses: actions/cache/restore@v5
        with:
          path: accrue/_build/test/*.plt*
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ matrix.sigra }}-${{ matrix.opentelemetry }}-plt-${{ hashFiles('accrue/mix.lock') }}

      - name: Create accrue PLTs
        if: steps.accrue_plt_cache.outputs.cache-hit != 'true'
        run: |
          set +e
          cd accrue
          output=$(mix dialyzer --plt --quiet 2>&1)
          status=$?
          printf '%s\n' "$output" | grep -Ev '^xmerl_ucs\.erl:[0-9]+:[0-9]+: Warning: missing specification for function ' || true
          exit "$status"

      - name: Save accrue PLT cache
        if: steps.accrue_plt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: accrue/_build/test/*.plt*
          key: ${{ steps.accrue_plt_cache.outputs.cache-primary-key }}

      - name: Accrue dialyzer
        run: cd accrue && mix dialyzer --format github

      - name: Accrue docs
        run: cd accrue && MIX_ENV=dev mix docs --warnings-as-errors

      - name: "Verify ExDoc @doc since: badges"
        run: bash scripts/ci/verify_exdoc_since_badges.sh

      - name: Accrue retired package audit
        run: cd accrue && mix hex.audit

      - name: Restore accrue_admin deps cache
        uses: actions/cache@v5
        with:
          path: accrue_admin/deps
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ matrix.sigra }}-${{ matrix.opentelemetry }}-accrue-admin-deps-${{ hashFiles('accrue_admin/mix.lock', 'accrue/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ matrix.sigra }}-${{ matrix.opentelemetry }}-accrue-admin-deps-

      - name: Install accrue_admin deps
        run: cd accrue_admin && mix deps.get

      - name: Accrue admin format
        run: cd accrue_admin && mix format --check-formatted

      - name: Accrue admin compile
        run: cd accrue_admin && mix compile --warnings-as-errors

      - name: Accrue admin test
        run: cd accrue_admin && mix test --warnings-as-errors

      - name: Accrue admin credo
        run: cd accrue_admin && mix credo --strict

      - name: Restore accrue_admin PLT cache
        id: accrue_admin_plt_cache
        uses: actions/cache/restore@v5
        with:
          path: accrue_admin/priv/plts
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ matrix.sigra }}-${{ matrix.opentelemetry }}-accrue-admin-plt-${{ hashFiles('accrue_admin/mix.lock', 'accrue/mix.lock', 'accrue/mix.exs', 'accrue/lib/**/*.ex', 'accrue/test/support/**/*.ex', 'accrue/credo_checks/**/*.ex') }}

      - name: Create accrue_admin PLTs
        if: steps.accrue_admin_plt_cache.outputs.cache-hit != 'true'
        run: |
          set +e
          cd accrue_admin
          output=$(mix dialyzer --plt --quiet 2>&1)
          status=$?
          printf '%s\n' "$output" | grep -Ev '^xmerl_ucs\.erl:[0-9]+:[0-9]+: Warning: missing specification for function ' || true
          exit "$status"

      - name: Save accrue_admin PLT cache
        if: steps.accrue_admin_plt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: accrue_admin/priv/plts
          key: ${{ steps.accrue_admin_plt_cache.outputs.cache-primary-key }}

      - name: Accrue admin dialyzer
        run: cd accrue_admin && mix dialyzer --format github

      - name: Accrue admin docs
        run: cd accrue_admin && MIX_ENV=dev mix docs --warnings-as-errors

      - name: Accrue admin retired package audit
        run: cd accrue_admin && mix hex.audit

      - name: Restore accrue_portal deps cache
        uses: actions/cache@v5
        with:
          path: accrue_portal/deps
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ matrix.sigra }}-${{ matrix.opentelemetry }}-accrue-portal-deps-${{ hashFiles('accrue_portal/mix.lock', 'accrue/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ matrix.sigra }}-${{ matrix.opentelemetry }}-accrue-portal-deps-

      - name: Install accrue_portal deps
        run: cd accrue_portal && mix deps.get

      - name: Accrue portal format
        run: cd accrue_portal && mix format --check-formatted

      - name: Accrue portal compile
        run: cd accrue_portal && mix compile --warnings-as-errors

      - name: Accrue portal test
        run: cd accrue_portal && mix test --warnings-as-errors

      - name: Accrue portal retired package audit
        run: cd accrue_portal && mix hex.audit


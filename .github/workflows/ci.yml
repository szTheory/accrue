        uses: actions/cache@v5
        with:
          path: examples/accrue_host/deps
          key: ${{ runner.os }}-otp28-elixir119-accrue-host-playwright-deps-${{ hashFiles('examples/accrue_host/mix.lock', 'accrue/mix.lock', 'accrue_admin/mix.lock', 'accrue_portal/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp28-elixir119-accrue-host-playwright-deps-

      - name: Install host deps
        run: cd examples/accrue_host && mix deps.get

      - name: Install browser deps
        run: |
          cd examples/accrue_host && npm ci

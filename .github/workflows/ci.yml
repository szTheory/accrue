  admin-group-contracts:
    name: Admin group contracts (Phase 190)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      ACCRUE_ADMIN_E2E_PORT: 4017

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Phase 190 browser-relevant changes
        id: phase190_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          relevant=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            relevant=true
          else
            from_sha="$BEFORE_SHA"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
              from_sha="$BASE_SHA"
            fi

            if [ -z "$from_sha" ] || printf '%s' "$from_sha" | grep -Eq '^0+$'; then
              relevant=true
            else
              git diff --name-only "$from_sha" "$GITHUB_SHA" > /tmp/phase190-changed-files.txt
              if grep -Eq '^(accrue/|accrue_admin/|scripts/ci/verify_phase190_automation_contract\.sh|\.github/workflows/ci\.yml|\.planning/phases/190-navigation-data-display-meta-component-cohesion/)' /tmp/phase190-changed-files.txt; then # archive-sweep-exempt: regex alternation matched against a git-diff changed-files listing, not a filesystem path read
                relevant=true
              fi
            fi
          fi

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Phase 190 browser-relevant changes: $relevant"

      - name: Phase 190 automation contract
        run: bash scripts/ci/verify_phase190_automation_contract.sh

      - name: Set up BEAM
        if: steps.phase190_changes.outputs.relevant == 'true'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.19.5'

      - name: Install Hex
        if: steps.phase190_changes.outputs.relevant == 'true'
        run: mix local.hex 2.4.2 --force

      - name: Set up Node
        if: steps.phase190_changes.outputs.relevant == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: accrue_admin/package-lock.json

      - name: Restore accrue_admin deps cache
        if: steps.phase190_changes.outputs.relevant == 'true'
        uses: actions/cache@v5
        with:
          path: accrue_admin/deps
          key: ${{ runner.os }}-otp28-elixir119-phase190-admin-deps-${{ hashFiles('accrue_admin/mix.lock', 'accrue/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp28-elixir119-phase190-admin-deps-

      - name: Install admin deps
        if: steps.phase190_changes.outputs.relevant == 'true'
        run: cd accrue_admin && mix deps.get

      - name: Compile admin package
        if: steps.phase190_changes.outputs.relevant == 'true'
        run: cd accrue_admin && mix compile --warnings-as-errors

      - name: Install browser deps
        if: steps.phase190_changes.outputs.relevant == 'true'
        run: cd accrue_admin && npm ci

      - name: Install Chromium
        if: steps.phase190_changes.outputs.relevant == 'true'
        run: cd accrue_admin && npx playwright install --with-deps chromium

      - name: Run Phase 190 group-contract browser gate
        if: steps.phase190_changes.outputs.relevant == 'true'
        run: cd accrue_admin && npm run e2e:group-contracts

      - name: Upload Playwright report
        if: failure() && steps.phase190_changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: admin-group-contracts-playwright-report
          path: accrue_admin/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure() && steps.phase190_changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: admin-group-contracts-playwright-traces
          path: accrue_admin/test-results
          if-no-files-found: ignore


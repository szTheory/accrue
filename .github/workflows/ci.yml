    name: Admin UI ratchet self-tests
    if: github.event_name != 'schedule'
    needs: [admin-hardening-guardrails, admin-phase200-guardrails]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: accrue_admin/package-lock.json

      - name: Install admin Node dependencies
        run: cd accrue_admin && npm ci

      - name: Run ratchet ledger self-tests
        run: cd accrue_admin && npm run ratchet:ledger:self-test

      - name: Verify UI ratchet sign-off self-test
        run: cd accrue_admin && npm run ratchet:signoff:self-test

      - name: Phase 208 CI contract
        run: cd accrue_admin && npm run ratchet:ci-contract

      # D-26 (232-06): placed here, in the BLOCKING job, rather than in the
      # parked job below. GitHub Actions' job-level "continue on error" flag
      # absorbs the whole job's conclusion regardless of any individual step's
      # own such setting -- there is no per-step override that
      # escapes a job-level flag. Since the expiry trigger's entire purpose is
      # to fail BLOCKINGLY the moment the parked lane's reason for existing
      # evaporates, it cannot live in a job whose failures are structurally
      # absorbed. See 232-06-SUMMARY.md for the negative-control proof.
      - name: Parked-lane expiry trigger (D-26)
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const ledgerPath = process.env.LEDGER_PATH || './accrue_admin/e2e/ratchet/ledger.baseline.json';
            const windowsPath = process.env.WINDOWS_PATH || '.planning/WINDOWS.md';
            const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
            const windowsText = fs.readFileSync(windowsPath, 'utf8');
            const blockMatch = windowsText.match(/\`\`\`\`json\n([\s\S]*?)\n\`\`\`\`/);
            if (!blockMatch) {
              console.error('Parked-lane expiry trigger: FAIL: could not find the embedded JSON block in ' + windowsPath);
              process.exit(1);
            }
            const rows = JSON.parse(blockMatch[1]);
            const waiverRow = rows.find((row) => row.id === 11);
            const waiverExists = Boolean(waiverRow && waiverRow.status === 'waived');
            console.log('Parked-lane expiry trigger: ledger.frozen=' + ledger.frozen + ', ship-window row 11 waived=' + waiverExists);
            if (ledger.frozen === true && waiverExists) {
              console.error('Parked-lane expiry trigger: FAIL: the ratchet ledger is frozen:true but ship-window row 11 (the parked-ratchet waiver) still exists as waived in ' + windowsPath + ' -- an unexpected pass means the reason for parking evaporated. Un-park by renaming the guardrails job (dropping the [parked] marker) and resolving row 11, rather than leaving both stale.');
              process.exit(1);
            }
          "

  admin-ui-ratchet-guardrails:
    # D-25 (232-06): the "[parked]" display-name marker lands in the same
    # commit as the ANNOTATION_SWEEP_EXCLUDE disposition-key edit below --
    # the sweep matches normalized job display-name fragments, so the marker
    # and the exclusion key it drives must never be split across commits.
    name: "Admin UI ratchet guardrails [parked]"
    if: github.event_name != 'schedule'
    needs: [admin-hardening-guardrails, admin-phase200-guardrails]
    runs-on: ubuntu-24.04
    # NON-BLOCKING (disposition: parked) while the v1.56 Admin UI Ratchet milestone
    # remains PARKED (superseded by v1.57 on 2026-07-19). This lane is failing on
    # the merits, not un-run or advisory-by-design: ledger.baseline.json is
    # deliberately frozen:false with open findings deferred to v1.57 M3. The
    # machinery that would prove this lane (self-tests, CI contract) has been
    # split out into the blocking `admin-ui-ratchet-selftests` job above (D-23) --
    # only the two steps whose subject is the parked ledger stay non-blocking here.
    # This parked disposition is recorded as ONE waived row -- ship-window row 11
    # -- in .planning/WINDOWS.md (owner, rationale, and release impact live there,
    # not here; see D-22, no second waiver channel). Un-parking is two steps: (1)
    # drop this job's `[parked]` display-name marker (which re-arms the
    # annotation sweep automatically per its disposition-keyed
    # ANNOTATION_SWEEP_EXCLUDE below), and (2) re-freeze
    # accrue_admin/e2e/ratchet/ledger.baseline.json. The "Parked-lane expiry
    # trigger (D-26)" step in admin-ui-ratchet-selftests above fails blockingly if
    # the ledger goes frozen while ship-window row 11 still exists waived, so this
    # comment is an executable removal condition, not an aspirational one.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: accrue_admin/package-lock.json

      - name: Install admin Node dependencies
        run: cd accrue_admin && npm ci

      - name: Verify frozen ratchet evidence
        run: cd accrue_admin && npm run ratchet:ledger:verify-frozen

      - name: Verify UI ratchet sign-off
        run: cd accrue_admin && npm run ratchet:signoff

      # D-24 (232-06): replaces a step that unconditionally echoed nine
      # hardcoded "PASS" rows with no `if: always()` -- unreachable dead code
      # that would have started printing fabricated passes the moment the
      # step ahead of it (which fails on the merits today) went green. Every
      # value below is read or computed from the live ledger file; nothing is
      # a literal outcome word this step did not measure.
      - name: Ratchet status summary
        if: always()
        run: |
          node -e "
            const l = require('./accrue_admin/e2e/ratchet/ledger.baseline.json');
            const lines = [];
            lines.push('## Admin UI ratchet guardrails [parked]');
            lines.push('');
            lines.push('Real values read from accrue_admin/e2e/ratchet/ledger.baseline.json at run time.');
            lines.push('');
            lines.push('| Field | Value |');
            lines.push('| --- | --- |');
            lines.push('| schema_version | ' + l.schema_version + ' |');
            lines.push('| frozen | ' + l.frozen + ' |');
            lines.push('| epoch | ' + l.epoch + ' |');
            lines.push('| ledger_sha256 | ' + l.ledger_sha256 + ' |');
            lines.push('| resolved_locked rows | ' + (Array.isArray(l.resolved_locked) ? l.resolved_locked.length : 'unknown') + ' |');
            lines.push('');
            lines.push('| Lens | total open | minor | real |');
            lines.push('| --- | --- | --- | --- |');
            for (const [lens, counts] of Object.entries(l.confirmed_open || {})) {
              lines.push('| ' + lens + ' | ' + counts.total + ' | ' + counts.minor + ' | ' + counts.real + ' |');
            }
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "

      - name: Upload Phase 208 ratchet evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase208-ratchet-evidence
          path: |
            accrue_admin/e2e/ratchet/ledger.baseline.json
            accrue_admin/e2e/ratchet/finding-regressions.ndjson
            accrue_admin/e2e/ratchet/rounds.ndjson
            .planning/milestones/v1.56-phases/208-prove-convergence-on-the-representative-slice-wire-ci-accept/UI-RATCHET-SIGN-OFF.md
          if-no-files-found: ignore

  host-integration:
    # Phoenix/LiveView compatibility proof for Phase 15:
    # host-integration proves Phoenix 1.8 / LiveView 1.1 by running the seeded host app
    # pinned in examples/accrue_host/mix.exs and accrue_admin/mix.exs. Keep this as the
    # single host-level proof instead of creating a second compatibility matrix.
    # Bash doc / VERIFY-01 / planning SSOT gates run first in job `docs-contracts-shift-left`.
    # Required deterministic gate for TRUST-02 and TRUST-04:
    # trust review, seeded performance smoke, and browser accessibility/responsive checks
    # stay in this lane, and high-severity trust findings cannot be accepted here.
    name: Host integration (required deterministic gate)
    if: github.event_name != 'schedule'
    needs: [docs-contracts-shift-left]
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      ACCRUE_HOST_PORT: 4100
      ACCRUE_HOST_BROWSER_PORT: 4101
      ACCRUE_HOST_TEST_POOL_SIZE: 8
      ACCRUE_HOST_PLAYWRIGHT_WORKERS: 1
      ACCRUE_HOST_BROWSER_LOG: ${{ github.workspace }}/accrue-host-server.log

    steps:
      - uses: actions/checkout@v6

      - name: Set host CI evidence path
        run: echo "ACCRUE_CI_SETUP_FACTS=$RUNNER_TEMP/accrue-host-ci-setup-facts.ndjson" >> "$GITHUB_ENV"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.19.5'

      - name: Install Hex
        run: |
          mix local.hex 2.4.2 --force
          mix local.rebar --force

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/accrue_host/package-lock.json

      - name: Restore host deps cache
        uses: actions/cache@v5
        with:
          path: examples/accrue_host/deps
          key: ${{ runner.os }}-otp28-elixir119-accrue-host-deps-${{ hashFiles('examples/accrue_host/mix.lock', 'accrue/mix.lock', 'accrue_admin/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp28-elixir119-accrue-host-deps-

      - name: Install host deps
        run: cd examples/accrue_host && mix deps.get

      - name: Install browser deps
        run: |
          cd examples/accrue_host && npm ci
          cd assets && npm ci

      - id: install_chromium
        name: Install Chromium
        run: |
          setup_started=$(( $(date +%s) * 1000 ))
          if ! (cd examples/accrue_host && npm run e2e:install); then
            setup_finished=$(( $(date +%s) * 1000 ))
            bash scripts/ci/ci_setup_diagnostic.sh emit linux_browser_dependency --result failure --duration-ms "$(( setup_finished - setup_started ))" --node-identity node-22 --playwright-identity chromium-install --lockfile-identity package-lock --browser-class linux-dependency --cache-state uncached
            bash scripts/ci/ci_setup_diagnostic.sh render linux_browser_dependency
            exit 1
          fi

      - id: host_integration_gate
        name: Run host integration gate
        # Canonical trust lane: seeded performance smoke + browser accessibility/responsive checks.
        run: bash scripts/ci/accrue_host_uat.sh

      - id: host_setup_summary
        name: Summarize host and CI setup evidence
        if: always()
        run: |
          echo "## Host and CI setup evidence" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$ACCRUE_CI_SETUP_FACTS" ]; then
            node -e 'const fs=require("fs"); for (const line of fs.readFileSync(process.argv[1], "utf8").trim().split("\n")) { const fact=JSON.parse(line); console.log(`- **Fact:** ${fact.code}; **State:** ${fact.result}; **Owner:** ${fact.owner}; **Next command:** see scripts/ci/ci_setup_diagnostic.sh describe ${fact.code}; **Evidence:** accrue-host-ci-setup-facts artifact`); }' "$ACCRUE_CI_SETUP_FACTS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Fact:** setup record; **State:** no validated setup fact was emitted; **Owner:** CI; **Next command:** inspect the failing host-integration step; **Evidence:** accrue-host-ci-setup-facts artifact" >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: host_setup_artifact
        name: Upload host and CI setup facts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-host-ci-setup-facts
          path: ${{ runner.temp }}/accrue-host-ci-setup-facts.ndjson
          if-no-files-found: ignore

      - name: Run host Hex smoke
        # Release Please PRs bump the example to the next Hex version before it is published;
        # path-based host integration above already validates the branch. Hex smoke runs on
        # merge to main (and other PRs) against the published package.
        if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
        run: bash scripts/ci/accrue_host_hex_smoke.sh

      - name: Upload Playwright report
        # Heavy debugging artifact stays failure-only.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-host-playwright-report
          path: examples/accrue_host/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        # Heavy debugging artifact stays failure-only.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-host-playwright-traces
          path: examples/accrue_host/test-results
          if-no-files-found: ignore

      - name: Upload Phase 15 trust screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-host-phase15-screenshots
          path: examples/accrue_host/test-results/phase15-trust
          if-no-files-found: ignore

      - name: Upload host server log
        # Heavy debugging artifact stays failure-only.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-host-server-log
          path: ${{ github.workspace }}/accrue-host-server.log
          if-no-files-found: ignore

  playwright-e2e:
    name: Playwright E2E shard ${{ matrix.shard }}/${{ strategy.job-total }}
    if: github.event_name != 'schedule'
    needs: [host-integration]
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      ACCRUE_HOST_BROWSER_PORT: 4101
      ACCRUE_HOST_TEST_POOL_SIZE: 8
      ACCRUE_HOST_PLAYWRIGHT_WORKERS: 1
      ACCRUE_HOST_E2E_FIXTURE: /tmp/accrue-host-e2e-fixture-${{ matrix.shard }}.json

    steps:
      - uses: actions/checkout@v6

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.19.5'

      - name: Install Hex
        run: |
          mix local.hex 2.4.2 --force
          mix local.rebar --force

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            examples/accrue_host/package-lock.json
            examples/accrue_host/assets/package-lock.json

      - name: Restore host deps cache
        uses: actions/cache@v5
        with:
          path: examples/accrue_host/deps
          key: ${{ runner.os }}-otp28-elixir119-accrue-host-playwright-deps-${{ hashFiles('examples/accrue_host/mix.lock', 'accrue/mix.lock', 'accrue_admin/mix.lock', 'accrue_portal/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp28-elixir119-accrue-host-playwright-deps-

      - name: Install host deps
        run: cd examples/accrue_host && mix deps.get

      - name: Install browser deps
        run: |
          cd examples/accrue_host && npm ci
          cd assets && npm ci

      - name: Compile host
        run: cd examples/accrue_host && mix compile --warnings-as-errors

      - name: Build host assets
        run: cd examples/accrue_host && mix assets.build

      - name: Prepare E2E database fixture
        run: |
          cd examples/accrue_host
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix run ../../scripts/ci/accrue_host_seed_e2e.exs

      - name: Install Chromium
        run: cd examples/accrue_host && npm run e2e:install

      - name: Run Playwright shard
        env:
          ACCRUE_HOST_SKIP_PLAYWRIGHT_GLOBAL_SEED: "1"
        run: cd examples/accrue_host && npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report-shard-${{ matrix.shard }}
          path: examples/accrue_host/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-traces-shard-${{ matrix.shard }}
          path: examples/accrue_host/test-results
          if-no-files-found: ignore

  host-docker-smoke:
    name: Host Docker boot smoke
    if: github.event_name != 'schedule'
    needs: [docs-contracts-shift-left]
    runs-on: ubuntu-24.04
    env:
      ACCRUE_HOST_DOCKER_PORT: 4000
      ACCRUE_HOST_SKIP_SEEDS: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Ensure Docker proxy network exists
        run: docker network create proxy || true

      - name: Build and boot Docker host app
        run: cd examples/accrue_host && docker compose up --build -d

      - name: Wait for Docker host app
        # Cold first boot still fetches deps, compiles all path deps, migrates,
        # and builds first-paint assets before `mix phx.server`.
        run: |
          for _ in $(seq 1 900); do
            if curl -fsS http://localhost:4000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker compose -f examples/accrue_host/docker-compose.yml logs
          exit 1

      - name: Stop Docker host app
        if: always()
        run: cd examples/accrue_host && docker compose down --volumes --remove-orphans

  annotation-sweep:
    name: Annotation sweep
    if: always() && github.event_name != 'schedule'
    needs:
      [
        release-manifest-ssot,
        docs-contracts-shift-left,
        release-gate,
        phase18-tax-gate,
        admin-drift-docs,
        admin-group-contracts,
        admin-hardening-guardrails,
        admin-phase200-guardrails,
        admin-ui-ratchet-selftests,
        admin-ui-ratchet-guardrails,
        host-integration,
        playwright-e2e,
        host-docker-smoke,
      ]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Sweep release-facing annotations
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          # Non-blocking jobs whose annotations must not fail this release-facing sweep:
          #   'advisory' — advisory release-gate cells (continue-on-error: matrix.support ==
          #     'advisory', name-tagged "[advisory]"). Keep in sync with the release-gate
          #     matrix `support: 'advisory'` cells.
          #   'parked'   — D-25 (232-06): keyed on DISPOSITION, not subject. The
          #     "Admin UI ratchet guardrails [parked]" job's own machinery self-tests
          #     were split out into the separate, blocking admin-ui-ratchet-selftests
          #     job (D-23); only the two steps whose subject is the deliberately
          #     unfrozen ledger.baseline.json stay non-blocking here, while the v1.56
          #     ratchet milestone remains PARKED (waived as ship-window row 11 in
          #     .planning/WINDOWS.md). Un-parking is a job-name rename that drops the
          #     "[parked]" marker -- doing so automatically re-arms this sweep for the
          #     job with no second edit required, because the exclusion is keyed on
          #     the disposition fragment, not the job's identity.
          ANNOTATION_SWEEP_EXCLUDE: advisory,parked
          # Non-actionable upstream-dependency compiler deprecation (Oban emits
          # `first..last inside match is deprecated` on Elixir 1.19+). Accrue cannot fix
          # third-party source; first-party warnings are still enforced via the gates'
          # own `--warnings-as-errors`. Drop this once Oban ships a fix and is bumped.
          ANNOTATION_SWEEP_IGNORE_MESSAGE: 'first\.\.last inside match is deprecated'
        run: >-
          bash scripts/ci/annotation_sweep.sh release-manifest-ssot docs-contracts-shift-left
          release-gate phase18-tax-gate admin-drift-docs admin-group-contracts admin-hardening-guardrails
          admin-phase200-guardrails admin-ui-ratchet-selftests admin-ui-ratchet-guardrails host-integration
          playwright-e2e host-docker-smoke

  # ---------------------------------------------------------------------
  # Mandatory periodic live-Stripe fidelity job (quick task 260414-l9q).
  #
  # Runs on manual workflow_dispatch, the 06:00 UTC cron, and relevant repairs
  # merged to main as selected by provider-proof-trigger. It never runs on pull
  # requests or unrelated pushes. Provider failures are intentionally blocking
  # and are reconciled into one sanitized issue below.
  #
  # Requires STRIPE_TEST_SECRET_KEY to be configured as a repository
  # secret. Individual tests skip cleanly in setup_all when the secret
  # is absent.
  #
  # See guides/testing-live-stripe.md for details.
  # ---------------------------------------------------------------------
  live-stripe:
    # Job id stays `live-stripe` for `act -j live-stripe` compatibility; display
    # name reflects Stripe *test mode* keys (`STRIPE_TEST_SECRET_KEY`), not live mode.
    name: Stripe test-mode parity (mandatory periodic)
    needs: provider-proof-trigger
    runs-on: ubuntu-24.04
    if: ${{ needs.provider-proof-trigger.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_live_stripe)) }}
    concurrency:
      group: live-stripe-${{ github.sha }}
      cancel-in-progress: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      ACCRUE_LIVE_BASIC_PRICE: ${{ secrets.ACCRUE_LIVE_BASIC_PRICE }}
      ACCRUE_LIVE_PRO_PRICE: ${{ secrets.ACCRUE_LIVE_PRO_PRICE }}

    steps:
      - uses: actions/checkout@v6

      - name: Set live provider proof path
        run: echo "ACCRUE_PROVIDER_PROOF_RECORD=$RUNNER_TEMP/accrue-provider-proof.json" >> "$GITHUB_ENV"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.19.5'

      - name: Install Hex
        run: mix local.hex 2.4.2 --force

      - name: Install deps
        run: cd accrue && mix deps.get

      - name: Compile
        run: cd accrue && mix compile

      - name: Create + migrate test DB
        run: |
          cd accrue
          mix ecto.create
          mix ecto.migrate

      - id: provider_preflight
        name: Preflight live-Stripe provider configuration
        run: |
          if [ -n "${STRIPE_TEST_SECRET_KEY:-}" ] && [ -n "${STRIPE_WEBHOOK_SECRET:-}" ] && [ -n "${ACCRUE_LIVE_BASIC_PRICE:-}" ] && [ -n "${ACCRUE_LIVE_PRO_PRICE:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Live-Stripe configuration is incomplete; no credential values were printed." >&2
            exit 1
          fi

      - id: live_stripe_suite
        name: Run live-Stripe suite
        run: cd accrue && ACCRUE_PROVIDER_MANIFEST="$RUNNER_TEMP/accrue-provider-manifest.json" mix test.live

      - id: provider_proof_finalize
        name: Finalize live-Stripe provider proof
        if: always()
        run: >-
          node scripts/ci/provider_proof.mjs --finalize --trigger "${{ github.event_name }}"
          --sha "${{ github.sha }}" --policy required --raw-conclusion "${{ job.status }}"
          --configured "${{ steps.provider_preflight.outputs.configured }}"
          --manifest "$RUNNER_TEMP/accrue-provider-manifest.json"
          --out "$ACCRUE_PROVIDER_PROOF_RECORD"

      - id: provider_proof_summary
        name: Summarize live-Stripe provider proof
        if: always()
        run: node scripts/ci/render_provider_summary.mjs --record "$ACCRUE_PROVIDER_PROOF_RECORD" >> "$GITHUB_STEP_SUMMARY"

      - id: provider_proof_artifact
        name: Upload live-Stripe provider proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-stripe-proof
          path: |
            ${{ runner.temp }}/accrue-provider-proof.json
            ${{ runner.temp }}/accrue-provider-manifest.json
          if-no-files-found: ignore

  provider-proof-incident:
    name: Stripe provider-proof incident reconciliation
    needs: [provider-proof-trigger, live-stripe]
    if: ${{ always() && needs.provider-proof-trigger.result == 'success' && needs.provider-proof-trigger.outputs.should_run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_live_stripe) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Download provider proof
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: live-stripe-proof
          path: provider-proof-download

      - name: Reconcile the deduplicated provider-proof issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/provider_proof_automation.mjs --reconcile-issue
          --record provider-proof-download/accrue-provider-proof.json
          --repo "${{ github.repository }}"
          --sha "${{ github.sha }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

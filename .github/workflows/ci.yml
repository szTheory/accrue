  admin-ui-ratchet-guardrails:
    name: Admin UI ratchet guardrails
    if: github.event_name != 'schedule'
    needs: [admin-hardening-guardrails, admin-phase200-guardrails]
    runs-on: ubuntu-24.04
    # NON-BLOCKING while the v1.56 Admin UI Ratchet milestone is PARKED (superseded
    # by v1.57 on 2026-07-19). The verify-frozen / sign-off steps require a frozen
    # ledger with zero open findings, but v1.56 was parked mid-convergence at Phase
    # 208 (3/5): ledger.baseline.json is intentionally frozen:false with ~23 IA
    # findings deferred to v1.57. This gate was wired in 208-03 and has never been
    # satisfiable on main; it stayed dormant only because its Phase 192 dependency
    # was red. The job still runs (its deterministic self-tests keep reporting), but
    # its failure must not block CI while parked. REMOVE this line when v1.57 M3
    # re-freezes the ratchet (verify-frozen then passes on its own).
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: accrue_admin/package-lock.json

      - name: Install admin Node dependencies
        run: cd accrue_admin && npm ci

      - name: Run ratchet ledger self-tests
        run: cd accrue_admin && npm run ratchet:ledger:self-test

      - name: Verify frozen ratchet evidence
        run: cd accrue_admin && npm run ratchet:ledger:verify-frozen

      - name: Verify UI ratchet sign-off self-test
        run: cd accrue_admin && npm run ratchet:signoff:self-test

      - name: Verify UI ratchet sign-off
        run: cd accrue_admin && npm run ratchet:signoff

      - name: Phase 208 CI contract
        run: cd accrue_admin && npm run ratchet:ci-contract

      - name: Ratchet status summary
        run: |
          {
            echo "## Admin UI ratchet guardrails"
            echo ""
            echo "| Check | Status | Evidence |"
            echo "| --- | --- | --- |"
            echo "| No LLM key | PASS | PASS - ANTHROPIC_API_KEY is not required for this job |"
            echo "| Deterministic guardrails | PASS | PASS - deterministic ratchet guardrails are clean |"
            echo "| Finding regressions | PASS | PASS - finding-regressions.ndjson is 0 bytes |"
            echo "| Independent verifier | PASS | PASS - independent recompute matches ledger.baseline.json |"
            echo "| Synthetic count increase | PASS | PASS - synthetic count increase blocks the gate |"
            echo "| Persona regression | PASS | PASS - regressed lens count increase blocks the gate |"
            echo "| Existing UI gates | PASS | PASS - admin-hardening-guardrails, admin-phase200-guardrails, and asset-drift are green |"
            echo "| Bundle freshness | PASS | PASS - accrue_admin.css is fresh |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase 208 ratchet evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase208-ratchet-evidence
          path: |
            accrue_admin/e2e/ratchet/ledger.baseline.json
            accrue_admin/e2e/ratchet/finding-regressions.ndjson
            accrue_admin/e2e/ratchet/rounds.ndjson
            .planning/phases/208-prove-convergence-on-the-representative-slice-wire-ci-accept/UI-RATCHET-SIGN-OFF.md
          if-no-files-found: ignore

  host-integration:
    # Phoenix/LiveView compatibility proof for Phase 15:
    # host-integration proves Phoenix 1.8 / LiveView 1.1 by running the seeded host app
    # pinned in examples/accrue_host/mix.exs and accrue_admin/mix.exs. Keep this as the
    # single host-level proof instead of creating a second compatibility matrix.
    # Bash doc / VERIFY-01 / planning SSOT gates run first in job `docs-contracts-shift-left`.
    # Required deterministic gate for TRUST-02 and TRUST-04:
    # trust review, seeded performance smoke, and browser accessibility/responsive checks
    # stay in this lane, and high-severity trust findings cannot be accepted here.
    name: Host integration (required deterministic gate)
    if: github.event_name != 'schedule'
    needs: [docs-contracts-shift-left]
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      ACCRUE_HOST_PORT: 4100
      ACCRUE_HOST_BROWSER_PORT: 4101
      ACCRUE_HOST_TEST_POOL_SIZE: 8
      ACCRUE_HOST_PLAYWRIGHT_WORKERS: 1
      ACCRUE_HOST_BROWSER_LOG: ${{ github.workspace }}/accrue-host-server.log

    steps:
      - uses: actions/checkout@v6

      - name: Set host CI evidence path
        run: echo "ACCRUE_CI_SETUP_FACTS=$RUNNER_TEMP/accrue-host-ci-setup-facts.ndjson" >> "$GITHUB_ENV"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.19.5'

      - name: Install Hex
        run: |
          mix local.hex 2.4.2 --force
          mix local.rebar --force

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/accrue_host/package-lock.json

      - name: Restore host deps cache
        uses: actions/cache@v5
        with:
          path: examples/accrue_host/deps
          key: ${{ runner.os }}-otp28-elixir119-accrue-host-deps-${{ hashFiles('examples/accrue_host/mix.lock', 'accrue/mix.lock', 'accrue_admin/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp28-elixir119-accrue-host-deps-

      - name: Install host deps
        run: cd examples/accrue_host && mix deps.get

      - name: Install browser deps
        run: |
          cd examples/accrue_host && npm ci
          cd assets && npm ci

      - id: install_chromium
        name: Install Chromium
        run: |
          setup_started=$(( $(date +%s) * 1000 ))
          if ! (cd examples/accrue_host && npm run e2e:install); then
            setup_finished=$(( $(date +%s) * 1000 ))
            bash scripts/ci/ci_setup_diagnostic.sh emit linux_browser_dependency --result failure --duration-ms "$(( setup_finished - setup_started ))" --node-identity node-22 --playwright-identity chromium-install --lockfile-identity package-lock --browser-class linux-dependency --cache-state uncached
            bash scripts/ci/ci_setup_diagnostic.sh render linux_browser_dependency
            exit 1
          fi

      - id: host_integration_gate
        name: Run host integration gate
        # Canonical trust lane: seeded performance smoke + browser accessibility/responsive checks.
        run: bash scripts/ci/accrue_host_uat.sh

      - id: host_setup_summary
        name: Summarize host and CI setup evidence
        if: always()
        run: |
          echo "## Host and CI setup evidence" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$ACCRUE_CI_SETUP_FACTS" ]; then
            node -e 'const fs=require("fs"); for (const line of fs.readFileSync(process.argv[1], "utf8").trim().split("\n")) { const fact=JSON.parse(line); console.log(`- **Fact:** ${fact.code}; **State:** ${fact.result}; **Owner:** ${fact.owner}; **Next command:** see scripts/ci/ci_setup_diagnostic.sh describe ${fact.code}; **Evidence:** accrue-host-ci-setup-facts artifact`); }' "$ACCRUE_CI_SETUP_FACTS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Fact:** setup record; **State:** no validated setup fact was emitted; **Owner:** CI; **Next command:** inspect the failing host-integration step; **Evidence:** accrue-host-ci-setup-facts artifact" >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: host_setup_artifact
        name: Upload host and CI setup facts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-host-ci-setup-facts
          path: ${{ runner.temp }}/accrue-host-ci-setup-facts.ndjson
          if-no-files-found: ignore

      - name: Run host Hex smoke
        # Release Please PRs bump the example to the next Hex version before it is published;
        # path-based host integration above already validates the branch. Hex smoke runs on
        # merge to main (and other PRs) against the published package.
        if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
        run: bash scripts/ci/accrue_host_hex_smoke.sh

      - name: Upload Playwright report
        # Heavy debugging artifact stays failure-only.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-host-playwright-report
          path: examples/accrue_host/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        # Heavy debugging artifact stays failure-only.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-host-playwright-traces
          path: examples/accrue_host/test-results
          if-no-files-found: ignore

      - name: Upload Phase 15 trust screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-host-phase15-screenshots
          path: examples/accrue_host/test-results/phase15-trust
          if-no-files-found: ignore

      - name: Upload host server log
        # Heavy debugging artifact stays failure-only.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accrue-host-server-log
          path: ${{ github.workspace }}/accrue-host-server.log
          if-no-files-found: ignore


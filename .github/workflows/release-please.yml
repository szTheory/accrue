name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_release_as:
        description: 'Bootstrap note: use Release-As: 1.0.0 for both package paths before the first public publish.'
        required: false
        default: '1.0.0'

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      accrue_release_created: ${{ steps.release.outputs.accrue_release_created }}
      accrue_tag_name: ${{ steps.release.outputs.accrue_tag_name }}
      accrue_version: ${{ steps.release.outputs.accrue_version }}
      accrue_sha: ${{ steps.release.outputs.accrue_sha }}
      accrue_admin_release_created: ${{ steps.release.outputs.accrue_admin_release_created }}
      accrue_admin_tag_name: ${{ steps.release.outputs.accrue_admin_tag_name }}
      accrue_admin_version: ${{ steps.release.outputs.accrue_admin_version }}
      accrue_admin_sha: ${{ steps.release.outputs.accrue_admin_sha }}
      accrue_portal_release_created: ${{ steps.release.outputs.accrue_portal_release_created }}
      accrue_portal_tag_name: ${{ steps.release.outputs.accrue_portal_tag_name }}
      accrue_portal_version: ${{ steps.release.outputs.accrue_portal_version }}
      accrue_portal_sha: ${{ steps.release.outputs.accrue_portal_sha }}
    steps:
      - name: Bootstrap reminder
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Bootstrap reminder: carry Release-As: 1.0.0 for accrue and accrue_admin before the first public publish." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Release Please
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          NPM_CONFIG_LOGLEVEL: error
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          target_branch="${GITHUB_REF_NAME}"
          release_please="npx --yes release-please@17.6.0"

          release_exists() {
            gh release view "$1" --repo "$repo" >/dev/null 2>&1
          }

          write_release_outputs() {
            local output_prefix="$1"
            local manifest_path="$2"
            local before_release="$3"
            local version tag_name after_release tag_sha

            version="$(jq -r --arg path "$manifest_path" '.[$path] // empty' .release-please-manifest.json)"
            tag_name="${manifest_path}-v${version}"

            if [ -n "$version" ] && release_exists "$tag_name"; then
              after_release="true"
            else
              after_release="false"
            fi

            if [ "$before_release" = "false" ] && [ "$after_release" = "true" ]; then
              git fetch --force --tags origin "refs/tags/$tag_name:refs/tags/$tag_name"
              tag_sha="$(git rev-list -n 1 "$tag_name")"
              {
                echo "${output_prefix}_release_created=true"
                echo "${output_prefix}_tag_name=$tag_name"
                echo "${output_prefix}_version=$version"
                echo "${output_prefix}_sha=$tag_sha"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "${output_prefix}_release_created=false"
                echo "${output_prefix}_tag_name=$tag_name"
                echo "${output_prefix}_version=$version"
                echo "${output_prefix}_sha="
              } >> "$GITHUB_OUTPUT"
            fi
          }

          accrue_version="$(jq -r '.accrue // empty' .release-please-manifest.json)"
          accrue_admin_version="$(jq -r '.accrue_admin // empty' .release-please-manifest.json)"
          accrue_portal_version="$(jq -r '.accrue_portal // empty' .release-please-manifest.json)"
          accrue_tag="accrue-v${accrue_version}"
          accrue_admin_tag="accrue_admin-v${accrue_admin_version}"
          accrue_portal_tag="accrue_portal-v${accrue_portal_version}"

          if [ -n "$accrue_version" ] && release_exists "$accrue_tag"; then
            accrue_release_before="true"
          else
            accrue_release_before="false"
          fi

          if [ -n "$accrue_admin_version" ] && release_exists "$accrue_admin_tag"; then
            accrue_admin_release_before="true"
          else
            accrue_admin_release_before="false"
          fi

          if [ -n "$accrue_portal_version" ] && release_exists "$accrue_portal_tag"; then
            accrue_portal_release_before="true"
          else
            accrue_portal_release_before="false"
          fi

          if [ "$accrue_release_before" = "true" ] && \
             [ "$accrue_admin_release_before" = "true" ] && \
             [ "$accrue_portal_release_before" = "true" ]; then
            echo "All manifest releases already exist; skipping duplicate GitHub release creation." >> "$GITHUB_STEP_SUMMARY"
          else
            $release_please github-release \
              --repo-url "$repo" \
              --target-branch "$target_branch" \
              --config-file release-please-config.json \
              --manifest-file .release-please-manifest.json \
              --token "$RELEASE_PLEASE_TOKEN"
          fi

          write_release_outputs "accrue" "accrue" "$accrue_release_before"
          write_release_outputs "accrue_admin" "accrue_admin" "$accrue_admin_release_before"
          write_release_outputs "accrue_portal" "accrue_portal" "$accrue_portal_release_before"

          # Release Please sometimes creates only the core GitHub Release when both
          # packages bump in one merge; accrue_admin would never publish. When manifest
          # versions match (lockstep), still publish admin from this push SHA.
          accrue_created="$(grep '^accrue_release_created=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          accrue_admin_created="$(grep '^accrue_admin_release_created=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          accrue_portal_created="$(grep '^accrue_portal_release_created=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          if [ "$accrue_created" = "true" ] && [ "$accrue_admin_created" != "true" ]; then
            if [ -n "$accrue_version" ] && [ -n "$accrue_admin_version" ] && [ "$accrue_version" = "$accrue_admin_version" ]; then
              {
                echo "accrue_admin_release_created=true"
                echo "accrue_admin_tag_name=${accrue_admin_tag}"
                echo "accrue_admin_version=${accrue_admin_version}"
                echo "accrue_admin_sha=${GITHUB_SHA}"
              } >> "$GITHUB_OUTPUT"
              echo "Applied lockstep accrue_admin publish fallback (missing admin GitHub Release detection)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "$accrue_created" = "true" ] && [ "$accrue_portal_created" != "true" ]; then
            if [ -n "$accrue_version" ] && [ -n "$accrue_portal_version" ] && [ "$accrue_version" = "$accrue_portal_version" ]; then
              {
                echo "accrue_portal_release_created=true"
                echo "accrue_portal_tag_name=${accrue_portal_tag}"
                echo "accrue_portal_version=${accrue_portal_version}"
                echo "accrue_portal_sha=${GITHUB_SHA}"
              } >> "$GITHUB_OUTPUT"
              echo "Applied lockstep accrue_portal publish fallback (missing portal GitHub Release detection)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          $release_please release-pr \
            --repo-url "$repo" \
            --target-branch "$target_branch" \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json \
            --token "$RELEASE_PLEASE_TOKEN"

          release_pr_number="$(gh pr list --repo "$repo" --state open --head "release-please--branches--${target_branch}" --json number --jq '.[0].number // empty')"
          if [ -n "$release_pr_number" ]; then
            release_branch="$(gh pr view "$release_pr_number" --repo "$repo" --json headRefName --jq '.headRefName')"
            git fetch origin "$target_branch" "$release_branch"
            git checkout -B "$release_branch" "origin/$release_branch"

            expected_base="$(git rev-parse "origin/${target_branch}")"
            actual_base="$(git merge-base HEAD "$expected_base")"
            if [ "$actual_base" != "$expected_base" ]; then
              git checkout "$target_branch"
              git checkout -B "$release_branch" "$expected_base"
              git push --force-with-lease origin HEAD:"$release_branch"

              $release_please release-pr \
                --repo-url "$repo" \
                --target-branch "$target_branch" \
                --config-file release-please-config.json \
                --manifest-file .release-please-manifest.json \
                --token "$RELEASE_PLEASE_TOKEN"

              git fetch origin "$release_branch"
              git checkout -B "$release_branch" "origin/$release_branch"
            fi

            repair_version="$(jq -r '.accrue // empty' .release-please-manifest.json)"
            repair_admin_version="$(jq -r '.accrue_admin // empty' .release-please-manifest.json)"
            repair_portal_version="$(jq -r '.accrue_portal // empty' .release-please-manifest.json)"

            if [ -n "$repair_version" ] && [ "$repair_version" = "$repair_admin_version" ] && [ "$repair_portal_version" != "$repair_version" ]; then
              bash scripts/ci/repair_linked_release_pr.sh --version "$repair_version"
              if ! git diff --quiet; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add .release-please-manifest.json accrue_portal/mix.exs accrue_portal/CHANGELOG.md
                git commit -m "fix: repair linked portal release PR to ${repair_version}"
                git push origin HEAD:"$release_branch"
              fi
            fi

            git checkout "$target_branch"
            bash scripts/ci/verify_release_pr_scope.sh --pr "$release_pr_number"
          fi

  publish-accrue:
    name: Publish accrue
    needs: release
    if: ${{ needs.release.outputs.accrue_release_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.accrue_sha }}
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.1'
          elixir-version: '1.19.5'
      - name: Install Hex
        run: mix local.hex 2.4.2 --force
      - name: Install accrue deps
        run: cd accrue && mix deps.get
      - name: Verify accrue release version
        run: grep -n "@version \"${{ needs.release.outputs.accrue_version }}\"" accrue/mix.exs
      - name: Dry run accrue Hex publish
        run: cd accrue && mix hex.publish --dry-run
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      - name: Publish accrue to Hex
        run: cd accrue && mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  publish-accrue-admin:
    name: Publish accrue_admin
    needs: [release, publish-accrue]
    if: ${{ always() && needs.release.outputs.accrue_admin_release_created == 'true' && (needs.release.outputs.accrue_release_created != 'true' || needs.publish-accrue.result == 'success') }}
    runs-on: ubuntu-24.04
    env:
      ACCRUE_ADMIN_HEX_RELEASE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.accrue_admin_sha }}
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.1'
          elixir-version: '1.19.5'
      - name: Install Hex
        run: mix local.hex 2.4.2 --force
      - name: Install accrue_admin deps
        run: cd accrue_admin && mix deps.get
      - name: Verify accrue_admin release version
        run: grep -n "@version \"${{ needs.release.outputs.accrue_admin_version }}\"" accrue_admin/mix.exs
      - name: Dry run accrue_admin Hex publish
        run: cd accrue_admin && mix hex.publish --dry-run
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          ACCRUE_ADMIN_HEX_RELEASE: ${{ env.ACCRUE_ADMIN_HEX_RELEASE }}
      - name: Publish accrue_admin to Hex
        run: cd accrue_admin && mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          ACCRUE_ADMIN_HEX_RELEASE: ${{ env.ACCRUE_ADMIN_HEX_RELEASE }}

  publish-accrue-portal:
    name: Publish accrue_portal
    needs: [release, publish-accrue, publish-accrue-admin]
    if: ${{ always() && needs.release.outputs.accrue_portal_release_created == 'true' && (needs.release.outputs.accrue_release_created != 'true' || needs.publish-accrue.result == 'success') && (needs.release.outputs.accrue_admin_release_created != 'true' || needs.publish-accrue-admin.result == 'success') }}
    runs-on: ubuntu-24.04
    env:
      ACCRUE_PORTAL_HEX_RELEASE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.accrue_portal_sha }}
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.1'
          elixir-version: '1.19.5'
      - name: Install Hex
        run: mix local.hex 2.4.2 --force
      - name: Install accrue_portal deps
        run: cd accrue_portal && mix deps.get
      - name: Verify accrue_portal release version
        run: grep -n "@version \"${{ needs.release.outputs.accrue_portal_version }}\"" accrue_portal/mix.exs
      - name: Dry run accrue_portal Hex publish
        run: cd accrue_portal && mix hex.publish --dry-run
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          ACCRUE_PORTAL_HEX_RELEASE: ${{ env.ACCRUE_PORTAL_HEX_RELEASE }}
      - name: Publish accrue_portal to Hex
        run: cd accrue_portal && mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          ACCRUE_PORTAL_HEX_RELEASE: ${{ env.ACCRUE_PORTAL_HEX_RELEASE }}

  linked-release-proof:
    name: Linked release proof
    needs: [release, publish-accrue, publish-accrue-admin, publish-accrue-portal]
    if: ${{ always() && needs.release.outputs.accrue_release_created == 'true' && needs.release.outputs.accrue_admin_release_created == 'true' && needs.release.outputs.accrue_portal_release_created == 'true' && needs.publish-accrue.result == 'success' && needs.publish-accrue-admin.result == 'success' && needs.publish-accrue-portal.result == 'success' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      GH_TOKEN: ${{ github.token }}
      ACCRUE_HOST_HEX_SMOKE_WAIT_SECONDS: "900"
      LINKED_RELEASE_PROOF: linked-release-proof.md
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.1'
          elixir-version: '1.19.5'

      - name: Install Hex
        run: |
          mix local.hex 2.4.2 --force
          mix local.rebar --force

      - name: Capture linked release proof
        run: bash scripts/ci/capture_linked_release_proof.sh --auto --output "$LINKED_RELEASE_PROOF"

      - name: Run host Hex smoke
        run: |
          set -euo pipefail
          {
            echo
            echo "#### Host Hex smoke"
            echo
            echo '```text'
          } >> "$LINKED_RELEASE_PROOF"
          bash scripts/ci/accrue_host_hex_smoke.sh 2>&1 | tee -a "$LINKED_RELEASE_PROOF"
          echo '```' >> "$LINKED_RELEASE_PROOF"

      - name: Verify release notes contract
        run: |
          set -euo pipefail
          {
            echo
            echo "#### Release notes contract"
            echo
            echo '```text'
          } >> "$LINKED_RELEASE_PROOF"
          bash scripts/ci/verify_release_notes_contract.sh 2>&1 | tee -a "$LINKED_RELEASE_PROOF"
          echo '```' >> "$LINKED_RELEASE_PROOF"

      - name: Publish proof summary
        if: always()
        run: |
          if [ -f "$LINKED_RELEASE_PROOF" ]; then
            cat "$LINKED_RELEASE_PROOF" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload linked release proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linked-release-proof
          path: linked-release-proof.md
          if-no-files-found: error

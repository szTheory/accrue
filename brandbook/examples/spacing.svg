<svg xmlns="http://www.w3.org/2000/svg" width="572" height="376" viewBox="0 0 572 376"><title>Accrue spacing specimen</title><desc>Accrue spacing scale: --ax-space-2xs (2px/0.125rem) through --ax-space-3xl (64px/4rem). Each step shown as a labeled proportional ruler bar. Values are reference-only from theme.css; no --accrue-space-* tokens are minted (D-11).</desc><rect width="572" height="376" fill="#fafbfc"/><text x="32" y="28" fill="#111418" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600">Accrue spacing scale</text><text x="232" y="28" fill="#5d6a73" font-family="Geist, system-ui, sans-serif" font-size="10">(bars proportional to px value)</text><text x="32" y="62" fill="#111418" font-family="Geist Mono, monospace" font-size="10">--ax-space-2xs</text><text x="162" y="62" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">2px / 0.125rem</text><rect width="8.125" height="20" x="232" y="48" fill="#5e9e84" rx="2"/><text x="32" y="98" fill="#111418" font-family="Geist Mono, monospace" font-size="10">--ax-space-xs</text><text x="162" y="98" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">4px / 0.25rem</text><rect width="16.25" height="20" x="232" y="84" fill="#5e9e84" rx="2"/><text x="32" y="134" fill="#111418" font-family="Geist Mono, monospace" font-size="10">--ax-space-sm</text><text x="162" y="134" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">8px / 0.5rem</text><rect width="32.5" height="20" x="232" y="120" fill="#5e9e84" rx="2"/><text x="32" y="170" fill="#111418" font-family="Geist Mono, monospace" font-size="10">--ax-space-md</text><text x="162" y="170" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">16px / 1rem</text><rect width="65" height="20" x="232" y="156" fill="#5e9e84" rx="2"/><text x="32" y="206" fill="#111418" font-family="Geist Mono, monospace" font-size="10">--ax-space-lg</text><text x="162" y="206" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">24px / 1.5rem</text><rect width="97.5" height="20" x="232" y="192" fill="#5e9e84" rx="2"/><text x="32" y="242" fill="#111418" font-family="Geist Mono, monospace" font-size="10">--ax-space-xl</text><text x="162" y="242" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">32px / 2rem</text><rect width="130" height="20" x="232" y="228" fill="#5e9e84" rx="2"/><text x="32" y="278" fill="#111418" font-family="Geist Mono, monospace" font-size="10">--ax-space-2xl</text><text x="162" y="278" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">48px / 3rem</text><rect width="195" height="20" x="232" y="264" fill="#5e9e84" rx="2"/><text x="32" y="314" fill="#111418" font-family="Geist Mono, monospace" font-size="10">--ax-space-3xl</text><text x="162" y="314" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">64px / 4rem</text><rect width="260" height="20" x="232" y="300" fill="#5e9e84" rx="2"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="408" viewBox="0 0 640 408"><title>Accrue spacing specimen</title><desc>Accrue spacing scale: --ax-space-2xs (2px/0.125rem) through --ax-space-3xl (64px/4rem). Each step shown as a labeled proportional ruler bar. Values are reference-only from theme.css; no --accrue-space-* tokens are minted (D-11).</desc><text x="32" y="30" fill="currentColor" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600">Accrue spacing scale</text><text x="300" y="30" fill="currentColor" fill-opacity=".62" font-family="Geist, system-ui, sans-serif" font-size="11">(bars proportional to px value)</text><text x="32" y="71" fill="currentColor" font-family="Geist Mono, monospace" font-size="11">--ax-space-2xs</text><text x="180" y="71" fill="currentColor" fill-opacity=".62" font-family="Geist Mono, monospace" font-size="11">2px / 0.125rem</text><rect width="9.375" height="22" x="300" y="56" fill="#5e9e84" rx="2"/><text x="32" y="111" fill="currentColor" font-family="Geist Mono, monospace" font-size="11">--ax-space-xs</text><text x="180" y="111" fill="currentColor" fill-opacity=".62" font-family="Geist Mono, monospace" font-size="11">4px / 0.25rem</text><rect width="18.75" height="22" x="300" y="96" fill="#5e9e84" rx="2"/><text x="32" y="151" fill="currentColor" font-family="Geist Mono, monospace" font-size="11">--ax-space-sm</text><text x="180" y="151" fill="currentColor" fill-opacity=".62" font-family="Geist Mono, monospace" font-size="11">8px / 0.5rem</text><rect width="37.5" height="22" x="300" y="136" fill="#5e9e84" rx="2"/><text x="32" y="191" fill="currentColor" font-family="Geist Mono, monospace" font-size="11">--ax-space-md</text><text x="180" y="191" fill="currentColor" fill-opacity=".62" font-family="Geist Mono, monospace" font-size="11">16px / 1rem</text><rect width="75" height="22" x="300" y="176" fill="#5e9e84" rx="2"/><text x="32" y="231" fill="currentColor" font-family="Geist Mono, monospace" font-size="11">--ax-space-lg</text><text x="180" y="231" fill="currentColor" fill-opacity=".62" font-family="Geist Mono, monospace" font-size="11">24px / 1.5rem</text><rect width="112.5" height="22" x="300" y="216" fill="#5e9e84" rx="2"/><text x="32" y="271" fill="currentColor" font-family="Geist Mono, monospace" font-size="11">--ax-space-xl</text><text x="180" y="271" fill="currentColor" fill-opacity=".62" font-family="Geist Mono, monospace" font-size="11">32px / 2rem</text><rect width="150" height="22" x="300" y="256" fill="#5e9e84" rx="2"/><text x="32" y="311" fill="currentColor" font-family="Geist Mono, monospace" font-size="11">--ax-space-2xl</text><text x="180" y="311" fill="currentColor" fill-opacity=".62" font-family="Geist Mono, monospace" font-size="11">48px / 3rem</text><rect width="225" height="22" x="300" y="296" fill="#5e9e84" rx="2"/><text x="32" y="351" fill="currentColor" font-family="Geist Mono, monospace" font-size="11">--ax-space-3xl</text><text x="180" y="351" fill="currentColor" fill-opacity=".62" font-family="Geist Mono, monospace" font-size="11">64px / 4rem</text><rect width="300" height="22" x="300" y="336" fill="#5e9e84" rx="2"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="520" height="960" viewBox="0 0 520 960"><title>Accrue typography specimen</title><desc>Geist sans and Geist Mono type scale: --ax-type-xs (12px/0.75rem) through --ax-type-3xl (36px/2.25rem). Values are reference-only from theme.css; no --accrue-type-* tokens are minted (D-11).</desc><rect width="520" height="960" fill="#fafbfc"/><text x="32" y="58" fill="#111418" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600">Geist (sans) — type scale</text><text x="32" y="84" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-xs 12px / 0.75rem</text><text x="32" y="106" fill="#111418" font-family="Geist, system-ui, sans-serif" font-size="12">Billing state, modeled clearly.</text><text x="32" y="140" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-sm 14px / 0.875rem</text><text x="32" y="162" fill="#111418" font-family="Geist, system-ui, sans-serif" font-size="14">Billing state, modeled clearly.</text><text x="32" y="196" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-md 16px / 1rem</text><text x="32" y="218" fill="#111418" font-family="Geist, system-ui, sans-serif" font-size="16">Billing state, modeled clearly.</text><text x="32" y="252" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-lg 20px / 1.25rem</text><text x="32" y="274" fill="#111418" font-family="Geist, system-ui, sans-serif" font-size="20">Billing state, modeled clearly.</text><text x="32" y="308" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-xl 24px / 1.5rem</text><text x="32" y="330" fill="#111418" font-family="Geist, system-ui, sans-serif" font-size="24">Billing state, modeled clearly.</text><text x="32" y="364" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-2xl 28px / 1.75rem</text><text x="32" y="386" fill="#111418" font-family="Geist, system-ui, sans-serif" font-size="28">Billing state, modeled clearly.</text><text x="32" y="420" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-3xl 36px / 2.25rem</text><text x="32" y="442" fill="#111418" font-family="Geist, system-ui, sans-serif" font-size="36">Billing state, modeled clearly.</text><text x="32" y="526" fill="#111418" font-family="Geist Mono, monospace" font-size="13" font-weight="600">Geist Mono — type scale</text><text x="32" y="552" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-xs 12px / 0.75rem</text><text x="32" y="574" fill="#111418" font-family="Geist Mono, monospace" font-size="12">Billing state, modeled clearly.</text><text x="32" y="608" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-sm 14px / 0.875rem</text><text x="32" y="630" fill="#111418" font-family="Geist Mono, monospace" font-size="14">Billing state, modeled clearly.</text><text x="32" y="664" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-md 16px / 1rem</text><text x="32" y="686" fill="#111418" font-family="Geist Mono, monospace" font-size="16">Billing state, modeled clearly.</text><text x="32" y="720" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-lg 20px / 1.25rem</text><text x="32" y="742" fill="#111418" font-family="Geist Mono, monospace" font-size="20">Billing state, modeled clearly.</text><text x="32" y="776" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-xl 24px / 1.5rem</text><text x="32" y="798" fill="#111418" font-family="Geist Mono, monospace" font-size="24">Billing state, modeled clearly.</text><text x="32" y="832" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-2xl 28px / 1.75rem</text><text x="32" y="854" fill="#111418" font-family="Geist Mono, monospace" font-size="28">Billing state, modeled clearly.</text><text x="32" y="888" fill="#5d6a73" font-family="Geist Mono, monospace" font-size="10">--ax-type-3xl 
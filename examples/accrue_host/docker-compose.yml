name: ${ACCRUE_HOST_COMPOSE_PROJECT:-accrue-host}

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accrue_host_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Empty host port => Docker assigns a free ephemeral port (no collisions, ever).
    # Pin a fixed port by setting ACCRUE_HOST_DOCKER_PORT in .env (e.g. for OAuth callbacks).
    ports:
      - "${ACCRUE_HOST_DOCKER_BIND:-127.0.0.1}:${ACCRUE_HOST_DOCKER_PORT:-}:4000"
    environment:
      PGHOST: db
    volumes:
      - ../..:/workspace
      - mix_deps:/workspace/examples/accrue_host/deps
      - mix_build:/workspace/examples/accrue_host/_build
      - assets_node_modules:/workspace/examples/accrue_host/assets/node_modules
    depends_on:
      - db

volumes:
  pgdata:
  mix_deps:
  mix_build:
  assets_node_modules:
